<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import a statement | Financial Pandit</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js" integrity="sha384-PARf28kmic36Ve+O3DnUerRXFtOQ7ZDqRDGpLcbljly5/N39T2OV3kt3QsWOKeAX" crossorigin="anonymous"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span> financial-pandit</div>
    <span class="top-label">Import statement</span>
  </header>
  <main class="page">
    <div class="page-heading"><span class="heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-7m-3 3 3-3 3 3"/></svg></span><div><h1>Upload bank statement</h1><p class="intro">Bring your financial activity together in one place.</p></div></div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title" class="sr-only">Statement details</h2>
      <div class="auth-row"><div><strong>Microsoft account</strong><p id="auth-status" class="status" role="status" aria-live="polite">Sign in before importing a statement.</p></div><button type="button" id="sign-in" class="sign-in">Sign in with Microsoft</button></div>
      <form id="upload-form">
        <label class="dropzone" id="dropzone" for="file">
          <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-7m-3 3 3-3 3 3"/></svg></span>
          <strong id="file-title">Drop your CSV file here</strong>
          <span id="file-hint">or <span class="browse">browse files</span> from your device</span>
          <span class="file-type">CSV FORMAT</span>
        </label>
        <input id="file" type="file" accept=".csv,text/csv" required>
        <div class="fields">
          <div class="field"><label for="institution">Financial institution</label><input id="institution" name="institution" placeholder="e.g. Chase" autocomplete="organization" required></div>
          <div class="field"><label for="account">Account</label><input id="account" name="account" placeholder="e.g. Checking •••• 1234" required></div>
          <div class="field"><label for="period">Statement period <span>Optional</span></label><input id="period" name="period" type="month"></div>
        </div>
        <div class="notice"><span class="shield" aria-hidden="true">◇</span><div><strong>Your information matters</strong><p>Your statement is uploaded to your account when you select Import statement.</p></div></div>
        <button type="submit">Import statement</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
