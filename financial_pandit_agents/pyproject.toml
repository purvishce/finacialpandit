[project]
name = "financial_pandit_agents"
version = "0.1.0"
description = "financial_pandit_agents using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "matplotlib>=3.9,<4",
    "python-dotenv>=1,<2"
]

[project.scripts]
kickoff = "financial_pandit_agents.main:kickoff"
run_crew = "financial_pandit_agents.main:kickoff"
plot = "financial_pandit_agents.main:plot"
run_with_trigger = "financial_pandit_agents.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
